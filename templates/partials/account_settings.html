<div class="fixed inset-0 z-30 grid place-items-center bg-slate-950/35 p-4"
     onclick="this.remove()">
    <section class="w-full max-w-lg rounded-2xl bg-white p-7 shadow-2xl"
             onclick="event.stopPropagation()">
        <div class="flex items-start justify-between">
            <div>
                <p class="text-xs font-bold tracking-[.15em] text-brand uppercase">Google Cloud connection</p>
                <h2 class="mt-1 text-xl font-bold text-ink">Project settings</h2>
            </div>
            <button class="grid size-8 place-items-center rounded-lg text-slate-400 hover:bg-slate-100"
                    aria-label="Close"
                    onclick="document.getElementById('provider-dialog').innerHTML=''">
                <i class="size-5" data-lucide="x" aria-hidden="true"></i>
            </button>
        </div>
        <form class="settings-auth-form mt-6"
              hx-post="/account"
              hx-target="#app"
              hx-select="#app"
              hx-swap="outerHTML"
              hx-disabled-elt="find button[type='submit']">
            <label class="mb-1.5 block text-sm font-semibold text-slate-700"
                   for="settings-project-id">Google Cloud project ID or number</label><input class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm"
       id="settings-project-id"
       name="project_id"
       required
       value="{{ account.project_id }}">
            <p class="mt-2 text-xs leading-5 text-slate-500">Only one identifier is needed. Use the project ID or its numeric project number. Changing it requires Google authentication again.</p>
            <div class="mt-6 flex justify-end">
                <button class="inline-flex cursor-pointer items-center gap-2 rounded-lg bg-brand px-4 py-2.5 text-sm font-semibold text-white transition-colors enabled:hover:bg-brand-dark disabled:cursor-wait disabled:opacity-70"
                        type="submit"><span class="auth-action-spinner size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
      aria-hidden="true"></span>Save and reauthenticate</button>
            </div>
        </form>
    </section>
</div>
