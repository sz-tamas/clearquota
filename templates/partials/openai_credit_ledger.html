<section class="rounded-xl border border-slate-200 bg-white p-4">
    <h3 class="text-sm font-bold text-ink">Credit ledger</h3>
    <div class="mt-3 space-y-2">
        {% for event in credit_events %}
            <div class="flex items-center justify-between gap-3 rounded-lg bg-slate-50 px-3 py-2 text-xs">
                <span><strong class="uppercase">{{ event.event_type }}</strong> · {{ event.date }} · ${{ event.amount }}{% if !event.note.is_empty() %} · {{ event.note }}{% endif %}</span>
                <button class="font-semibold text-rose-600"
                        type="button"
                        hx-post="/providers/{{ provider.id }}/credit-events/{{ event.id }}/delete"
                        hx-target="#provider-ledger-{{ provider.id }}"
                        hx-swap="innerHTML">Remove</button>
            </div>
        {% else %}
            <p class="text-sm text-slate-500">No ledger entries yet.</p>
        {% endfor %}
    </div>
    <form class="mt-4 grid gap-3 sm:grid-cols-2 min-[62.5rem]:grid-cols-4"
          hx-post="/providers/{{ provider.id }}/credit-events"
          hx-target="#provider-ledger-{{ provider.id }}"
          hx-swap="innerHTML">
        <select class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
                name="event_type">
            <option value="purchase">Purchase</option>
            <option value="refund">Refund</option>
            <option value="adjustment">Adjustment</option>
        </select>
        <input class="rounded-lg border border-slate-200 px-3 py-2 text-sm"
               name="date"
               type="date"
               required>
        <input class="rounded-lg border border-slate-200 px-3 py-2 text-sm"
               name="amount"
               type="number"
               min="0.01"
               step="0.01"
               placeholder="Amount (USD)"
               required>
        <input class="rounded-lg border border-slate-200 px-3 py-2 text-sm"
               name="note"
               placeholder="Note (optional)">
        <button class="w-fit rounded-lg bg-slate-700 px-3 py-2 text-sm font-semibold text-white sm:col-span-2 min-[62.5rem]:col-span-4"
                type="submit">Add ledger entry</button>
    </form>
</section>
