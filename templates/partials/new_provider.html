<form class="mt-5 grid gap-4 rounded-xl border border-violet-100 bg-violet-50/50 p-5 shadow-sm"
      hx-post="/providers"
      hx-target="#app"
      hx-select="#app"
      hx-swap="outerHTML">
    <div>
        <label class="mb-1.5 block text-xs font-semibold text-slate-600"
               for="provider_type">Provider</label><select class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/20"
        id="provider_type"
        name="provider_type">
            <option value="resend" {% if provider_type == "resend" %}selected{% endif %}>Resend</option>
            <option value="apify" {% if provider_type == "apify" %}selected{% endif %}>Apify</option>
            <option value="openai" {% if provider_type == "openai" %}selected{% endif %}>OpenAI</option>
            <option value="neon" disabled>Neon (coming soon)</option>
            <option value="upstash" disabled>Upstash (coming soon)</option>
        </select>
    </div>
    <div>
        <label class="mb-1.5 block text-xs font-semibold text-slate-600"
               for="display_name">Display name <span class="font-normal text-slate-400">(optional to change)</span></label><input class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none placeholder:text-slate-400 focus:border-brand focus:ring-2 focus:ring-brand/20"
       id="display_name"
       name="display_name"
       required
       value="{{ display_name }}">
    </div>
    <div>
        <label class="mb-1.5 block text-xs font-semibold text-slate-600"
               for="secret_ref">Secret Manager secret name</label><input class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 font-mono text-xs outline-none placeholder:font-sans placeholder:text-slate-400 focus:border-brand focus:ring-2 focus:ring-brand/20"
       id="secret_ref"
       name="secret_ref"
       required
       placeholder="EXAMPLE_API_KEY"><small class="mt-1 block text-[11px] text-slate-500">Uses this connection’s Google project. The secret value is never stored.</small>
    </div>
    <div id="resend-config"
         data-provider-config="resend"
         {% if provider_type != "resend" %}hidden{% endif %}>
        <div class="grid gap-4 sm:grid-cols-3">
            <div>
                <label class="mb-1.5 block text-xs font-semibold text-slate-600" for="plan">Plan</label><input class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
       id="plan"
       name="plan"
       placeholder="e.g. Pro"
       {% if provider_type == "resend" %}required{% else %}disabled{% endif %}>
            </div>
            <div>
                <label class="mb-1.5 block text-xs font-semibold text-slate-600"
                       for="monthly_quota">Monthly quota</label><input class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
       id="monthly_quota"
       name="monthly_quota"
       type="number"
       min="1"
       step="1"
       placeholder="50000"
       {% if provider_type == "resend" %}required{% else %}disabled{% endif %}>
            </div>
            <div>
                <label class="mb-1.5 block text-xs font-semibold text-slate-600"
                       for="daily_quota">Daily quota</label><input class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
       id="daily_quota"
       name="daily_quota"
       type="number"
       min="1"
       step="1"
       placeholder="1000"
       {% if provider_type == "resend" %}required{% else %}disabled{% endif %}>
            </div>
        </div>
        <p class="mt-2 text-xs text-slate-500">Resend only: the plan is a label; monthly and daily quotas are used for calculations.</p>
    </div>
    <div id="apify-config"
         data-provider-config="apify"
         {% if provider_type != "apify" %}hidden{% endif %}>
        <label class="mb-1.5 block text-xs font-semibold text-slate-600"
               for="apify_monthly_credit_allowance">Monthly credit allowance (USD)</label><input class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm"
       id="apify_monthly_credit_allowance"
       name="apify_monthly_credit_allowance"
       type="number"
       min="0.01"
       step="0.01"
       placeholder="19"
       {% if provider_type == "apify" %}required{% else %}disabled{% endif %}>
        <p class="mt-2 text-xs text-slate-500">Apify only: enter the plan’s included monthly credits, such as $19 for Starter.</p>
    </div>
    <button class="rounded-lg bg-brand px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-dark"
            type="submit">Save provider</button>
</form>
