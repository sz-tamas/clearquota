<section id="provider-list"
         class="mt-6 grid items-start gap-4 min-[800px]:grid-cols-2"
         aria-hidden="true">
    {% for _ in 0..2 %}
        <article class="animate-pulse rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex items-start justify-between gap-3">
                <div class="w-2/3">
                    <div class="h-3 w-20 rounded-full bg-slate-200"></div>
                    <div class="mt-3 h-6 w-40 rounded-md bg-slate-200"></div>
                </div>
                <div class="size-8 rounded-lg bg-slate-100"></div>
            </div>
            <div class="mt-6 grid grid-cols-2 gap-3">
                {% for _ in 0..4 %}
                    <div class="rounded-xl border border-slate-100 bg-slate-50 p-3">
                        <div class="h-2.5 w-24 rounded-full bg-slate-200"></div>
                        <div class="mt-3 h-6 w-20 rounded-md bg-slate-200"></div>
                        <div class="mt-5 h-8 w-full rounded-md bg-slate-200"></div>
                    </div>
                {% endfor %}
            </div>
            <div class="mt-5 h-3 w-32 rounded-full bg-slate-100"></div>
        </article>
    {% endfor %}
</section>
