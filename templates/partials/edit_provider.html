<div class="fixed inset-0 z-30 grid place-items-center bg-slate-950/35 p-4"
     onclick="this.remove()">
    <section class="w-full max-w-lg rounded-2xl bg-white p-7 shadow-2xl"
             onclick="event.stopPropagation()">
        <div class="flex items-start justify-between gap-4">
            <div>
                <p class="text-xs font-bold tracking-[.15em] text-brand uppercase">Provider settings</p>
                <h2 class="mt-1 text-xl font-bold text-ink">Edit {{ provider.display_name }}</h2>
            </div>
            <button class="grid size-8 place-items-center rounded-lg text-slate-400 hover:bg-slate-100"
                    aria-label="Close"
                    onclick="document.getElementById('provider-dialog').innerHTML=''">
                <i class="size-5" data-lucide="x" aria-hidden="true"></i>
            </button>
        </div>
        <form class="mt-6 grid gap-4"
              hx-post="/providers/{{ provider.id }}"
              hx-target="#app"
              hx-select="#app"
              hx-swap="outerHTML">
            <div>
                <label class="mb-1.5 block text-sm font-semibold text-slate-700"
                       for="edit-display-name">Display name</label><input class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm"
       id="edit-display-name"
       name="display_name"
       required
       value="{{ provider.display_name }}">
            </div>
            <div>
                <label class="mb-1.5 block text-sm font-semibold text-slate-700"
                       for="edit-secret-ref">Secret Manager reference</label><input class="w-full rounded-lg border border-slate-200 px-3 py-2 font-mono text-xs"
       id="edit-secret-ref"
       name="secret_ref"
       required
       value="{{ provider.secret_ref }}">
            </div>
            <div class="mt-2 flex items-center justify-between">
                <button class="text-sm font-semibold text-rose-600"
                        type="button"
                        onclick="fetch('/providers/{{ provider.id }}/delete/confirm').then(r=>r.text()).then(html=>{document.getElementById('provider-dialog').innerHTML=html})">Delete provider</button><button class="rounded-lg bg-brand px-4 py-2.5 text-sm font-semibold text-white"
        type="submit">Save changes</button>
            </div>
        </form>
    </section>
</div>
