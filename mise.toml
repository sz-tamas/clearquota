[tools]
rust = "stable"
"cargo:bacon" = "latest"
"pipx:djlint" = "latest"

[tool_alias]
tailwindcss = "github:tailwindlabs/tailwindcss"

[tools.tailwindcss]
version = "latest"
matching_regex = "^tailwindcss-(macos|linux|windows)-"
bin = "tailwindcss"

[env]
RUST_LOG = "info"
USAGE_DASH_PORT = 5050

[tasks.install]
description = "Fetch Rust dependencies, install the platform-specific Tailwind CLI, and build CSS"
run = "cargo fetch && mise run css:build"

[tasks."css:build"]
description = "Compile Tailwind CSS without npm or node_modules"
hide = true
run = "tailwindcss -i static/css/input.css -o static/css/output.css --minify"

[tasks."lint"]
description = "Checks Rust and Askama template formatting"
raw = true
hide = true
run = "cargo fmt --all --check && djlint templates --check"

[tasks.check]
description = "Check formatting and compile the Rust application"
run = "mise run lint && cargo check"

[tasks."fmt"]
description = "Formats Rust code and Askama templates"
raw = true
run = "cargo fmt --all && djlint templates --reformat --quiet"

[tasks.test]
description = "Run the Rust test suite"
run = "cargo test --locked"

[tasks.start]
description = "Build CSS and start the localhost dashboard"
depends = ["lint"]
run = "mise run css:build && cargo run"

[tasks.dev]
description = "Watch Rust and templates with Bacon, and rebuild CSS on changes"
depends = ["lint"]
run = '''
mise run css:build
tailwindcss -i static/css/input.css -o static/css/output.css --minify --watch &
css_pid=$!
trap 'kill "$css_pid" 2>/dev/null || true' EXIT INT TERM
bacon run
'''
