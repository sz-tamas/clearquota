
name: Request a provider
description: Suggest a developer service for ClearQuota to support.
title: "[Provider]: "
labels: ["provider-request"]

body:
  - type: input
    id: provider
    attributes:
      label: Provider name
      placeholder: e.g. Cloudflare
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Provider website
      placeholder: https://example.com

  - type: textarea
    id: metrics
    attributes:
      label: What would you like to track?
      placeholder: Spending, API requests, quotas, etc.
    validations:
      required: true
