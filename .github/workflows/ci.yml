name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: mise run check
      - run: mise run test
      - run: cargo clippy --locked -- -D warnings
      - run: cargo install cargo-audit --locked
      - run: cargo audit
